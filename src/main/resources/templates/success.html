<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>결제 완료</title>
    <style>
        body { font-family: sans-serif; margin: 40px; text-align: center; }
        .response-section { margin: 20px 0; display: inline-block; text-align: left; }
        .response-label { font-weight: bold; display: inline-block; width: 100px; }
        .response-text  { margin-left: 8px; }
        button { margin: 8px; padding: 8px 16px; }
        #error { color: red; margin-top: 20px; }
    </style>
</head>
<body>
<div id="loading">
    <p>결제 처리 중입니다… 잠시만 기다려주세요.</p>
</div>

<div id="confirm-success" style="display:none;">
    <h2>결제를 완료했어요 🎉</h2>
    <div class="response-section">
        <div>
            <span class="response-label">결제금액:</span>
            <span id="amount" class="response-text">-</span> 원
        </div>
        <div>
            <span class="response-label">주문번호:</span>
            <span id="orderId" class="response-text">-</span>
        </div>
        <div>
            <span class="response-label">결제키:</span>
            <span id="paymentKey" class="response-text">-</span>
        </div>
        <div>
            <span class="response-label">결제ID:</span>
            <span id="paymentId" class="response-text">-</span>
        </div>
    </div>
    <button id="cancelBtn">환불하기</button>   <!-- 환불 버튼 -->
    <button id="closeBtn">닫기</button>        <!-- 창 닫기 버튼 -->
    <div id="cancelResult" style="margin-top:12px;"></div> <!-- 환불 결과 표시 -->
</div>

<div id="error" style="display:none;"></div>  <!-- 에러 메시지 영역 -->

<script>
    (function() {
        const params     = new URLSearchPa
        rams(window.location.search);
        const paymentKey = params.get('paymentKey');  // URL에서 paymentKey 추출
        const orderId    = params.get('orderId');     // URL에서 orderId 추출
        const amount     = params.get('amount');      // URL에서 amount 추출
        const paymentId  = params.get('paymentId');   // URL에서 paymentId 추출

        console.log('▶ 페이지 파라미터:', { paymentKey, orderId, amount, paymentId });

        if (!paymentKey || !orderId || !amount) {
            // 필수 정보 누락 시 에러 표시
            document.getElementById('loading').style.display = 'none';
            const err = document.getElementById('error');
            err.textContent = '결제 정보가 올바르게 전달되지 않았습니다.';
            err.style.display = 'block';
            return;
        }

        // 2초 후에 성공 화면으로 전환
        setTimeout(() => {
            document.getElementById('loading').style.display         = 'none';
            document.getElementById('confirm-success').style.display = 'block';
            document.getElementById('paymentKey').textContent        = paymentKey;
            document.getElementById('orderId').textContent           = orderId;
            document.getElementById('amount').textContent            = amount;
            document.getElementById('paymentId').textContent         = paymentId || '-';

            // 환불 요청 클릭 이벤트
            document.getElementById('cancelBtn').addEventListener('click', () => {
                const resultEl = document.getElementById('cancelResult');
                resultEl.textContent = '환불 요청 중…';

                // ★ 컨트롤러 매핑에 맞춘 Cancel API 엔드포인트
                const url = `${window.location.origin}/api/v1/payments/${paymentKey}/cancel`;
                console.log('▶ 환불 요청 URL:', url);

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId:      orderId,            // 주문번호
                        amount:       Number(amount),     // 환불 금액
                        cancelReason: '사용자 요청'         // 환불 사유
                    })
                })
                    .then(res => {
                        console.log('▶ 서버 응답 상태:', res.status);
                        if (!res.ok)
                            return res.text().then(t => Promise.reject(t));  // 에러 텍스트로 넘김
                        return res.json();
                    })
                    .then(json => {
                        console.log('▶ 환불 성공 응답:', json);
                        resultEl.textContent = `환불 성공: 환불금액 ${json.payAmount}원`;
                    })
                    .catch(err => {
                        console.error('▶ 환불 요청 에러:', err);
                        resultEl.innerHTML = `환불 실패: ${err}<br/><button id="retry">다시 시도</button>`;
                        document.getElementById('retry').addEventListener('click', () => {
                            resultEl.textContent = '';
                        });
                    });
            });

            // 창 닫기 버튼
            document.getElementById('closeBtn').addEventListener('click', () => {
                window.close();
            });
        }, 2000);
    })();
</script>
</body>
</html>
